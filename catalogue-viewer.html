<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalogue | Unilog Derma Solutions</title>

    <!-- dFlip CSS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/dflip.min.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/css/themify-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Favicons -->
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <style>
        /* OFFICIAL BRAND THEME FROM NAVBAR.CSS */
        :root {
            --primary: #4C2896;
            /* Unilog Purple */
            --secondary: #8038A2;
            /* Unilog Light Purple */
            --white: #ffffff;
            --black: #000000;
            --font-family: "Montserrat", sans-serif;
            --bg-dark: #0a0f1c;
            --glass-bg: rgba(76, 40, 150, 0.2);
            /* Tinted with brand primary */
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-family);
            color: var(--white);
        }

        /* Ambient Brand Glow Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 15% 15%, rgba(76, 40, 150, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(76, 40, 150, 0.1) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        #flipbook-container {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Themed Brand Loader */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-dark);
            transition: opacity 0.6s ease;
        }

        .loader-logo {
            width: 150px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px rgba(76, 40, 150, 0.4));
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            color: var(--white);
            margin-top: 20px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 0.75rem;
            opacity: 0.9;
        }

        /* Brand Top Header */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1001;
            background: linear-gradient(to bottom, rgba(10, 15, 28, 0.95), transparent);
            box-sizing: border-box;
        }

        .back-btn {
            background-color: var(--primary);
            color: var(--white);
            padding: 10px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(76, 40, 150, 0.3);
            border: 2px solid var(--primary);
        }

        .back-btn:hover {
            background-color: transparent;
            color: var(--white);
            transform: scale(1.05) translateX(-5px);
        }

        .header-title {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 3px;
            color: var(--white);
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* FLOATING ISLAND CONTROL BAR (BRAND THEMED) */
        .df-container {
            background-color: transparent !important;
        }

        /* MINIMAL FLOATING CONTROL BAR */
        .df-ui-controls {
            backdrop-filter: blur(14px);
            background: rgba(20, 20, 30, 0.6) !important;
            height: 52px !important;
            padding: 0 18px !important;
            border-radius: 40px !important;

            display: flex !important;
            align-items: center !important;
            gap: 8px;

            left: 50% !important;
            transform: translateX(-50%) !important;
            bottom: 24px !important;

            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        /* BUTTONS */
        .df-ui-btn {
            background: transparent !important;
            color: rgba(255, 255, 255, 0.75) !important;

            width: 36px !important;
            height: 36px !important;
            border-radius: 50% !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            transition: all 0.2s ease !important;
        }

        /* HOVER EFFECT */
        .df-ui-btn:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            color: #fff !important;
            transform: scale(1.05);
        }

        /* ACTIVE BUTTON */
        .df-ui-btn.active {
            background: rgba(76, 40, 150, 0.9) !important;
            color: #fff !important;
        }

        /* PAGE TEXT */
        .df-ui-page-status {
            font-size: 0.8rem !important;
            color: rgba(255, 255, 255, 0.7) !important;
            margin: 0 8px !important;
        }

        /* REMOVE EXTRA ICONS (OPTIONAL CLEANUP) */
        .df-ui-btn[data-id="share"],
        .df-ui-btn[data-id="sound"],
        .df-ui-btn[data-id="start"],
        .df-ui-btn[data-id="end"] {
            display: none !important;
        }

        /* MORE OPTIONS DROPDOWN */
        .more-container {
            background-color: var(--primary) !important;
            border-radius: 15px !important;
            padding: 10px 0 !important;
            width: 220px !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .more-container:before {
            border-top-color: var(--primary) !important;
        }

        .more-container .df-ui-btn {
            width: 100% !important;
            background: transparent !important;
            color: var(--white) !important;
            border: none !important;
            padding: 12px 20px !important;
            height: auto !important;
            border-radius: 0 !important;
            text-align: left !important;
            display: flex !important;
            align-items: center !important;
            justify-content: flex-start !important;
        }

        .more-container .df-ui-btn:hover {
            background: rgba(255, 255, 255, 0.1) !important;
            transform: none !important;
        }

        .more-container .df-ui-btn span {
            display: inline-block !important;
            padding-left: 15px !important;
            font-size: 0.85rem !important;
            font-weight: 500 !important;
            color: var(--white) !important;
        }

        .more-container .df-ui-btn:before {
            font-size: 1.1rem !important;
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
        }

        /* Branding Layer */
        .brand-layer {
            position: fixed;
            bottom: 110px;
            right: 30px;
            z-index: 1000;
            opacity: 0.35;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .brand-layer img {
            width: 130px;
        }

        @media screen and (max-width: 600px) {
            .df-ui-controls {
                min-width: 320px !important;
                padding: 0 15px !important;
                bottom: 20px !important;
            }

            .header-title {
                display: none;
            }
        }
    </style>

</head>

<body>

    <div class="ambient-bg"></div>

    <div id="loader-wrapper">
        <img src="./assets/image/footer-logo.webp" alt="Logo" class="loader-logo">
        <div class="spinner"></div>
        <div class="loader-text">Opening 3D Experience</div>
    </div>

    <div class="top-header">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            BACK TO HOME
        </a>
        <div class="header-title">UNILOG DERMA SOLUTIONS</div>
        <div style="width: 150px;"></div>
    </div>

    <div class="brand-layer">
        <img src="./assets/image/footer-logo.webp" alt="Unilog">
    </div>

    <div class="_df_book" id="flipbook-container" source="./assets/catalogue/catalogue.pdf" webgl="true" height="100%"
        backgroundcolor="transparent">
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@dearhive/dearflip-jquery-flipbook@1.7.3/dflip/js/dflip.min.js"></script>

    <script>
        $(document).ready(function () {
            setTimeout(() => {
                $('#loader-wrapper').fadeOut(1000);
            }, 3000);
        });
    </script>
</body>

</html>
